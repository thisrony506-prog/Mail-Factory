    <!-- Early PWA Install Prompt Capture & SW Registration -->
    <script>
      (function() {
        window.__mf_deferred_prompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__mf_deferred_prompt = e;
          window.dispatchEvent(new CustomEvent('mf_pwa_ready', { detail: e }));
        });
        window.addEventListener('appinstalled', function() {
          window.__mf_deferred_prompt = null;
          try {
            localStorage.setItem('mailfactory_pwa_installed', 'true');
          } catch(err) {}
          window.dispatchEvent(new CustomEvent('mf_pwa_installed'));
        });
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              console.log('[PWA] SW active with scope:', reg.scope);
            }).catch(function(err) {
              console.warn('[PWA] SW registration notice:', err);
            });
          });
        }
      })();
    </script>

    <!-- Suppress Vite HMR WebSocket connection errors in preview environment -->
    <script>
      (function() {
        function isIgnoredError(reason) {
          if (!reason) return false;
          const msg = String(reason.message || reason);
          return msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite') || msg.includes('HMR');
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isIgnoredError(event.reason)) {
            event.preventDefault();
            event.stopPropagation();
          }
        });

        const originalError = console.error;
        console.error = function(...args) {
          if (args.length > 0 && isIgnoredError(args[0])) {
            return;
          }
          originalError.apply(console, args);
        };
      })();
    </script>
