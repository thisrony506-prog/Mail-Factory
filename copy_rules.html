<div class="card">
  <h2>2️⃣ Cloud Firestore Rules (বসাবেন: Firebase Console > Firestore Database > Rules)</h2>
  <button onclick="copyText('firestore', 'msg2')">📋 Copy Firestore Rules</button><span id="msg2" class="msg"></span>
  <textarea id="firestore" readonly>rules_version = '2';

service cloud.firestore {
  match /databases/{database}/documents {
    
    function isAuthenticated() { 
      return request.auth != null; 
    }
    
    function isAdmin() {
      return isAuthenticated() && (
        request.auth.token.admin == true ||
        request.auth.token.email in ['gmrony135@gmail.com', 'mailfactorybd@gmail.com', 'iamronyofficial1@gmail.com']
      );
    }
    
    function isOwner(userId) { 
      return isAuthenticated() && request.auth.uid == userId; 
    }

    match /reviews/{userId} {
      allow get: if isAdmin() || resource.data.status == 'approved' || isOwner(userId);
      allow list: if isAdmin() || resource.data.status == 'approved';
      
      allow create: if isOwner(userId) 
                    && request.resource.data.userId == userId 
                    && request.resource.data.status == 'pending' 
                    && request.resource.data.rating is int 
                    && request.resource.data.rating >= 1 && request.resource.data.rating <= 5;
                    
      allow update: if isAdmin() || (
        isOwner(userId) 
        && request.resource.data.userId == userId 
        && request.resource.data.status == 'pending' 
        && request.resource.data.rating is int 
        && request.resource.data.rating >= 1 && request.resource.data.rating <= 5
      );
      
      allow delete: if isAdmin() || isOwner(userId);
    }

    match /system/{docId} {
      allow read: if true;
      allow write: if isAdmin();
    }

    match /{document=**} {
      allow read, write: if isAuthenticated();
    }
  }
}</textarea>
</div>

<script>
function copyText(elemId, msgId) {
  var copyText = document.getElementById(elemId);
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(copyText.value);
  document.getElementById(msgId).innerText = "Copied! ✅";
  setTimeout(() => { document.getElementById(msgId).innerText = ""; }, 3000);
}
</script>

</body>
