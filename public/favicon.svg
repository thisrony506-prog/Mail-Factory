<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pwaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Rounded Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#pwaBg)" />
  
  <!-- Mail Factory Envelope Symbol -->
  <g filter="url(#dropShadow)">
    <!-- Base Envelope Box -->
    <rect x="96" y="140" width="320" height="232" rx="24" fill="#FFFFFF" />
    
    <!-- Top Flap Accent -->
    <path d="M96 160 L256 280 L416 160" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Bottom Wings / Lines -->
    <path d="M96 350 L200 245" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round" />
    <path d="M416 350 L312 245" stroke="#E2E8F0" stroke-width="12" stroke-linecap="round" />
    
    <!-- Factory Lightning / Spark Star badge -->
    <circle cx="256" cy="280" r="32" fill="url(#goldGrad)" />
    <path d="M256 260 L262 274 L276 280 L262 286 L256 300 L250 286 L236 280 L250 274 Z" fill="#FFFFFF" />
  </g>
</svg>
